[tools]
zig = "0.17.0"

[tasks.format]
alias = "fmt"
description = "Format Zig sources"
run = "zig fmt --ast-check build.zig build_codecs.zig build_opus.zig build_usb.zig build_art.zig src tests tools"

[tasks.lint]
description = "Check formatting and Zig syntax"
run = "zig fmt --check --ast-check build.zig build_codecs.zig build_opus.zig build_usb.zig build_art.zig src tests tools"

[tasks.build]
description = "Build the SPL and stage-two firmware"
run = "zig build --summary all"

[tasks.test]
description = "Run host-side tests"
run = "zig build test --summary all"

[tasks.fuzz]
description = "Fuzz production parsers and the SPL image builder"
run = "zig build test --fuzz=100K --summary all"

[tasks.bench]
description = "Run host-side FLAC performance benchmarks"
run = "zig build bench --summary all"

[tasks.bench-f20]
description = "Run RAM-only FLAC benchmarks on a mask-ROM F20"
run = "tools/run_f20_bench.sh"

[tasks.test-ui]
description = "Run deterministic UI and display regressions in Debug and ReleaseFast"
run = "zig build test-ui --summary all"

[tasks.fuzz-ui]
description = "Fuzz display packing and bounds with 100,000 cases"
run = "zig build fuzz-ui --fuzz=100K --summary all"

[tasks.build-sim]
description = "Build the generic F20 simulator (SDL3 required)"
run = 'zig build build-sim ${SDL_PREFIX:+-Dsdl-prefix="$SDL_PREFIX"}'

[tasks.sim]
description = "Run a native app in the F20 simulator (set GAIN_SIM_APP)"
run = 'zig build sim -Dsim-app="${GAIN_SIM_APP:?Set GAIN_SIM_APP to a native app library}" ${SDL_PREFIX:+-Dsdl-prefix="$SDL_PREFIX"}'

[tasks.sim-check]
description = "Run native simulator release qualification headlessly"
run = 'zig build test-sim ${SDL_PREFIX:+-Dsdl-prefix="$SDL_PREFIX"} --summary all'

[tasks.fuzz-sim]
description = "Fuzz bounded simulator JSON commands without SDL"
run = "zig build test-sim-core --fuzz=100K --summary all"

[tasks.bench-ui-f20]
description = "Run RAM-only UI pixel and performance qualification on the F20"
run = "tools/run_ui_bench.sh"

[tasks.check]
description = "Run every required project check"
run = [
    { task = "lint" },
    { task = "build" },
    { task = "test" },
    { task = "test-tools" },
]

[tasks.fuzz-codecs]
description = "Fuzz container parsers and PCM conversion with 100,000 cases"
run = "zig build fuzz-codecs --fuzz=100K --summary all"

[tasks.test-codecs]
description = "Run decoder accuracy, seek, cancellation and buffered pipeline tests"
run = "zig build test-codecs --summary all"

[tasks.test-pipeline]
description = "Run deterministic executive, input, memory and output regressions"
run = "zig build test-pipeline --summary all"

[tasks.check-player-f20]
description = "Qualify the production player over RAM-only USB (set GAIN_USBBOOT; pass --output)"
run = "python3 tools/run_player_checks.py"

[tasks.test-tools]
description = "Test RAM-only qualification transport policy with mocked USB"
run = "python3 -m unittest discover -s tools -p 'test_*.py'"

[tasks.test-usb]
description = "Test USB ownership, real MSC class and descriptors in Debug and ReleaseFast"
run = "zig build test-usb --summary all"

[tasks.check-usb-f20]
description = "Qualify USB SD copy/eject on macOS (pass --output; set GAIN_USBBOOT)"
run = "python3 tools/run_usb_checks.py"

[tasks.check-music-f20]
description = "Qualify production Cover Flow, playback and indexing over RAM-only USB"
run = "python3 tools/run_music_checks.py"

[tasks.fonts]
description = "Regenerate pinned glyph masks (requires Pillow)"
run = ["python3 tools/build_fonts.py", "zig fmt src/font_data.zig"]
